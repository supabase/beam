name: Publish Supabase Beam fork

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        type: choice
        options: [staging, prod, both]
        default: staging
      version:
        description: 'Version suffix (e.g. supabase.1 -> 2.74.0-supabase.1)'
        required: true
        type: string
      module:
        description: 'Beam module to publish'
        type: choice
        options:
          - ':sdks:java:io:iceberg'
        default: ':sdks:java:io:iceberg'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        env: ${{ inputs.target == 'both' && fromJSON('["staging","prod"]') || fromJSON(format('["{0}"]', inputs.target)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Resolve target project
        id: target
        env:
          PROJECT_STAGING: ${{ vars.GCP_PROJECT_STAGING }}
          PROJECT_PROD: ${{ vars.GCP_PROJECT_PROD }}
          WIF_STAGING: ${{ vars.WIF_PROVIDER_STAGING }}
          WIF_PROD: ${{ vars.WIF_PROVIDER_PROD }}
        run: |
          if [[ "${{ matrix.env }}" == "prod" ]]; then
            project="$PROJECT_PROD"
            wif_provider="$WIF_PROD"
          else
            project="$PROJECT_STAGING"
            wif_provider="$WIF_STAGING"
          fi
          echo "project=${project}" >> "$GITHUB_OUTPUT"
          echo "wif_provider=${wif_provider}" >> "$GITHUB_OUTPUT"
          echo "service_account=beam-publisher@${project}.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.target.outputs.wif_provider }}
          service_account: ${{ steps.target.outputs.service_account }}

      # Adds an ArtifactRegistry maven repo to Beam's existing mavenJava publication
      # without touching upstream Beam source (keeps fork drift minimal).
      #
      # We use artifactregistry-auth-common directly to fetch an ADC-resolved access
      # token instead of the artifactregistry-gradle-plugin, because the plugin's
      # artifactregistry:// URL transport hook only registers for repos created at
      # apply time. Beam configures publishing during evaluation, so our extra repo
      # has to be added in afterEvaluate — which is too late for the plugin's hook
      # (https://github.com/GoogleCloudPlatform/artifact-registry-maven-tools/issues/45).
      # Doing the auth manually with Basic auth + oauth2accesstoken is exactly what
      # the plugin does internally, just at the right phase.
      - name: Write Gradle init script
        run: |
          cat > /tmp/beam-publish-init.gradle <<'EOF'
          initscript {
              repositories { mavenCentral() }
              dependencies {
                  classpath 'com.google.cloud.artifactregistry:artifactregistry-auth-common:2.2.5'
              }
          }

          import com.google.cloud.artifactregistry.auth.DefaultCredentialProvider
          import com.google.auth.oauth2.OAuth2Credentials

          allprojects {
              afterEvaluate { proj ->
                  if (proj.path != System.getProperty('targetModule')) return

                  if (proj.hasProperty('publishVersion')) {
                      proj.version = proj.publishVersion
                  }

                  if (proj.plugins.hasPlugin('maven-publish')) {
                      def credential = DefaultCredentialProvider.getInstance().getCredential() as OAuth2Credentials
                      credential.refreshIfExpired()
                      def accessToken = credential.getAccessToken().getTokenValue()

                      proj.publishing {
                          repositories {
                              maven {
                                  name = 'ArtifactRegistry'
                                  url = uri(proj.mavenRepoUrl.toString().replaceFirst('artifactregistry://', 'https://'))
                                  credentials {
                                      username = 'oauth2accesstoken'
                                      password = accessToken
                                  }
                                  authentication {
                                      basic(BasicAuthentication)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Publish ${{ inputs.module }} to ${{ matrix.env }}
        env:
          MODULE: ${{ inputs.module }}
          VERSION: 2.74.0-${{ inputs.version }}
          REPO_URL: artifactregistry://europe-maven.pkg.dev/${{ steps.target.outputs.project }}/dataflow-java-custom
        run: |
          ./gradlew "${MODULE}:publishMavenJavaPublicationToArtifactRegistryRepository" \
            -Ppublishing \
            --init-script /tmp/beam-publish-init.gradle \
            -DtargetModule="${MODULE}" \
            -PpublishVersion="${VERSION}" \
            -PmavenRepoUrl="${REPO_URL}"
