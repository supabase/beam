name: Publish Supabase Beam fork (2.74-supabase)

# Publishes fork-patched Beam jars to the supabase `dataflow-java-custom`
# Artifact Registry repo. Triggered on push to this fork branch — every push
# publishes a fresh, timestamped version to staging (prod target is commented
# out below; uncomment when we're ready to promote).
#
# Currently the only patch this fork carries is the iceberg manifest
# bound-padding fix in `:sdks:java:io:iceberg` (PR pending upstream): on the
# write path Beam was copying ByteBuffer.array() instead of [position, limit),
# leaking trailing 0x00 bytes into Iceberg manifest column bounds and
# breaking equality predicate pushdown for the minimum value of any
# string column.
#
# MODULES is intentionally a list so additional fork-patched Beam artifacts
# can be added later under the same publish job and version stamp.

on:
  push:
    branches:
      - 2.74-supabase

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          # Auto-derive version as <base from gradle.properties>-supabase-<utc ts>.
          # Each push yields a unique, monotonically-ordered version.
          base="$(grep -E '^version=' gradle.properties | cut -d= -f2 | sed 's/-SNAPSHOT$//')"
          version="${base}-supabase-$(date -u +%Y%m%d-%H%M%S)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

  publish:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        env:
          - staging
          # - prod  # uncomment to also publish to prod on each push

    env:
      # Modules to publish. All stamped with the same workflow version so the
      # consumer can pin a single `beam = "<version>"` in its catalog and
      # consume all of them as a coherent set.
      # The first six are the modules the data-engineering templates depend on
      # directly. The rest are transitive Beam siblings declared in those
      # modules' POMs at the unqualified fork base version (2.74.0). Since
      # 2.74.0 is unreleased upstream, those refs can't resolve from Maven
      # Central — so we publish the whole transitive set under the same
      # -supabase-<ts> stamp. Expand this list whenever a new consumer dep
      # surfaces another unresolved sibling. Drop the transitives once Beam
      # 2.74 GAs and we can rely on Maven Central for non-patched modules.
      MODULES: |
        :sdks:java:core
        :sdks:java:managed
        :sdks:java:io:google-cloud-platform
        :sdks:java:io:iceberg
        :runners:direct-java
        :runners:google-cloud-dataflow-java
        :model:pipeline
        :model:fn-execution
        :model:job-management
        :sdks:java:transform-service-launcher
        :runners:core-java
        :sdks:java:harness
        :sdks:java:expansion-service
        :sdks:java:extensions:avro
        :sdks:java:extensions:google-cloud-platform-core
        :sdks:java:extensions:protobuf
        :sdks:java:extensions:arrow
        :sdks:java:io:parquet

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      # setup-java writes a default ~/.m2/settings.xml with a GitHub Packages
      # credential template. Beam's applyJavaNature applies
      # net.linguica.maven-settings which actively reads that file, fails to
      # decrypt the templated credential, and aborts gradle configuration.
      - name: Remove auto-generated Maven settings.xml
        run: rm -f ~/.m2/settings.xml

      - name: Resolve target env
        id: target
        env:
          PROJECT_STAGING: ${{ vars.GCP_PROJECT_STAGING }}
          PROJECT_PROD: ${{ vars.GCP_PROJECT_PROD }}
          WIF_STAGING: ${{ vars.WIF_PROVIDER_STAGING }}
          WIF_PROD: ${{ vars.WIF_PROVIDER_PROD }}
          PUBLISHER_SA_STAGING: ${{ vars.PUBLISHER_SA_STAGING }}
          PUBLISHER_SA_PROD: ${{ vars.PUBLISHER_SA_PROD }}
        run: |
          if [[ "${{ matrix.env }}" == "prod" ]]; then
            echo "project=$PROJECT_PROD" >> "$GITHUB_OUTPUT"
            echo "wif_provider=$WIF_PROD" >> "$GITHUB_OUTPUT"
            echo "service_account=$PUBLISHER_SA_PROD" >> "$GITHUB_OUTPUT"
          else
            echo "project=$PROJECT_STAGING" >> "$GITHUB_OUTPUT"
            echo "wif_provider=$WIF_STAGING" >> "$GITHUB_OUTPUT"
            echo "service_account=$PUBLISHER_SA_STAGING" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.target.outputs.wif_provider }}
          service_account: ${{ steps.target.outputs.service_account }}

      # Init script that:
      #   1. Overrides project.version on EVERY project (not just the target
      #      module) to publishVersion — so cross-module deps in generated POMs
      #      reference each other at the fork version. Without this, sibling
      #      Beam modules keep gradle.properties' default `2.74.0-SNAPSHOT` and
      #      the published POM ends up declaring transitive Beam deps at
      #      SNAPSHOT, which causes downstream conflict-resolution to discard
      #      the fork's version. (See discussion in supabase/data-engineering
      #      iceberg AbstractMethodError debugging.)
      #   2. Configures the ArtifactRegistry publication repo on the module
      #      we're currently publishing.
      - name: Write Gradle init script
        run: |
          cat > /tmp/beam-publish-init.gradle <<'EOF'
          initscript {
              repositories { mavenCentral() }
              dependencies {
                  classpath 'com.google.cloud.artifactregistry:artifactregistry-auth-common:2.2.5'
              }
          }

          import com.google.cloud.artifactregistry.auth.DefaultCredentialProvider
          import com.google.auth.oauth2.OAuth2Credentials

          // Resolve OAuth token once per gradle invocation for the
          // publication repo.
          def credential = DefaultCredentialProvider.getInstance().getCredential() as OAuth2Credentials
          credential.refreshIfExpired()
          def accessToken = credential.getAccessToken().getTokenValue()

          allprojects { proj ->
              def httpsRepoUrl = proj.findProperty('mavenRepoUrl')?.toString()?.replaceFirst('artifactregistry://', 'https://')

              afterEvaluate {
                  // Sibling MODULES projects: stamp at publishVersion so the
                  // target module's published POM declares cross-fork-module
                  // deps at the fork version (otherwise gradle.properties'
                  // 2.74.0 default would leak through and consumers would
                  // resolve sibling deps from upstream Maven Central instead).
                  //
                  // Non-MODULES projects keep their natural project.version
                  // ('2.74.0' from gradle.properties at v2.74.0-RC1), so
                  // cross-Beam refs to them in the published POM correctly
                  // point at upstream Maven Central.
                  def forkedPaths = (System.getenv('MODULES') ?: '').split('\\s+').findAll { it }
                  if (proj.path in forkedPaths && proj.hasProperty('publishVersion')) {
                      proj.version = proj.publishVersion
                  }

                  // Only configure the publishing repo on the module
                  // currently being published.
                  if (proj.path != System.getProperty('targetModule')) return

                  if (proj.plugins.hasPlugin('maven-publish')) {
                      proj.publishing {
                          repositories {
                              maven {
                                  name = 'ArtifactRegistry'
                                  url = uri(httpsRepoUrl)
                                  credentials {
                                      username = 'oauth2accesstoken'
                                      password = accessToken
                                  }
                                  authentication { basic(BasicAuthentication) }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Publish modules to ${{ matrix.env }}
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          REPO_URL: artifactregistry://europe-maven.pkg.dev/${{ steps.target.outputs.project }}/dataflow-java-custom
        run: |
          while read -r module; do
            [[ -z "$module" ]] && continue
            echo "::group::Publishing ${module} @ ${VERSION} to ${{ matrix.env }}"
            ./gradlew "${module}:publishMavenJavaPublicationToArtifactRegistryRepository" \
              -Ppublishing \
              --init-script /tmp/beam-publish-init.gradle \
              -DtargetModule="${module}" \
              -PpublishVersion="${VERSION}" \
              -PmavenRepoUrl="${REPO_URL}" \
              --console=plain
            echo "::endgroup::"
          done <<< "$MODULES"
